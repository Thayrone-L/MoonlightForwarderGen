name: Validar projeto

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Validar traduções
        shell: pwsh
        run: ./scripts/Validate-Localization.ps1
      - name: Restaurar dependências
        run: dotnet restore MoonlightForwarderGenerator.sln
      - name: Compilar
        run: dotnet build MoonlightForwarderGenerator.sln -c Release --no-restore
      - name: Executar testes
        run: dotnet test MoonlightForwarderGenerator.sln -c Release --no-build --no-restore
